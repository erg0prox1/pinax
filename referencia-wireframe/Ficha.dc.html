<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha de captura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EDF0F2; color: #16202A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 24px; gap: 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="Componentes.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 500; color: #0B5FA5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B5FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
P60
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #5B6773">Miguel Alemán · P60</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Ficha de componente</h1>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nombre" style="font-size: 14px; font-weight: 600">Nombre corto</label>
<input id="nombre" value="Transformador T1" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #B5BFC8; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #16202A">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="tipo" style="font-size: 14px; font-weight: 600">Tipo de componente</label>
<select id="tipo" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #B5BFC8; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #16202A">
<option>Eléctrico</option>
<option>Hidráulico</option>
<option>Electrónico</option>
<option>Sensor</option>
<option>Infraestructura</option>
<option>Consumible</option>
<option>Estructural y señalización</option>
<option>TI</option>
<option>Mobiliario</option>
<option>Radios</option>
<option>Generador</option>
<option>ATS</option>
<option>Minisplit</option>
</select>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border: 2px solid #0B5FA5; border-radius: 10px; background: #FFFFFF; color: #0B5FA5; font-family: inherit; font-size: 16px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B5FA5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Tomar foto
</button>
<div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0">
<div style="width: 52px; height: 52px; flex: none; border-radius: 8px; background: #C9D1D8; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6773" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-8 8"></path></svg>
</div>
<span style="font-size: 12px; color: #5B6773; line-height: 1.3">Placa.jpg<br>guardada en el equipo</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="notas" style="font-size: 14px; font-weight: 600">Comentarios (leídos de la foto)</label>
<textarea id="notas" rows="6" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #B5BFC8; border-radius: 10px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.5; color: #16202A; resize: none">MARCA: SIEMENS
MODELO: 3RT2026-1BB40
SERIE: S VPB1234567
24 VDC / 60 Hz
IP20</textarea>
<span style="font-size: 12px; color: #5B6773">Texto sugerido desde la foto. Revísalo y edítalo antes de guardar.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
<sc-if value="{{ saved }}" hint-placeholder-val="{{ true }}">
<div role="status" style="display: flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #D9EEDD; color: #1B5E2B; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B5E2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
Guardado. Sigues en la ficha.
</div>
</sc-if>
<button onClick="{{ save }}" style="min-height: 56px; border: none; border-radius: 12px; background: #0B5FA5; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Guardar</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
saved: !!(this.state && this.state.saved),
save: () => this.setState({ saved: true })
};
}
}
</script>
</body>
</html>
